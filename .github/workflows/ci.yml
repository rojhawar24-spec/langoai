name: CI

# 🔒 Audit fix (Phase 1 — "build gate"): typecheck + test + build run on
# every push and PR. A red ❌ here means something doesn't compile or a
# test broke — it does NOT by itself block deployment, because Vercel's
# GitHub integration deploys independently of GitHub Actions.
#
# To actually make failures block merging (and, if you want, block
# deploys), turn this into a required status check:
#   GitHub → your repo → Settings → Branches → Branch protection rules
#   → add rule for `main` → "Require status checks to pass" → select "CI".
# That's a repo setting, not something in this file — I can't turn it on
# for you from here.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time env vars the app reads via import.meta.env — dummy
          # values so `vite build` succeeds in CI without real secrets.
          # Real values live in Vercel's own environment variables and are
          # never needed here; this build's only job is to confirm the
          # code compiles.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

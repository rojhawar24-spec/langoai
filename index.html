<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ BUG-31 FIXED: user-scalable=no removed — WCAG 1.4.4 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Lango AI — AI-Powered Language Learning</title>
    <meta name="description" content="Learn English, Dutch, French, German &amp; Spanish with AI-powered grammar lessons, vocabulary, daily word, tests and an AI tutor powered by Claude." />
    <meta name="keywords"    content="language learning, AI tutor, learn English, learn Dutch, learn French, learn German, learn Spanish, grammar, vocabulary" />
    <meta name="author"      content="Lango AI" />
    <meta name="robots"      content="index, follow" />

    <!-- ✅ BUG-33 FIXED: Open Graph tags -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://langoaiapp.vercel.app" />
    <meta property="og:site_name"   content="Lango AI" />
    <meta property="og:title"       content="Lango AI — AI-Powered Language Learning" />
    <meta property="og:description" content="Learn 5 languages with AI-powered grammar, vocabulary, daily word and a real-time Claude AI tutor." />
    <meta property="og:image"       content="https://langoaiapp.vercel.app/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Lango AI — Language Learning Platform" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Lango AI — AI-Powered Language Learning" />
    <meta name="twitter:description" content="Learn 5 languages with an AI tutor powered by Claude." />
    <meta name="twitter:image"       content="https://langoaiapp.vercel.app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://langoaiapp.vercel.app" />

    <!-- ✅ SEO-FIX (audit): structured data zodat Google de app als
         WebApplication kan herkennen voor rich results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lango AI",
        "url": "https://langoaiapp.vercel.app",
        "description": "Learn English, Dutch, French, German and Spanish with AI-powered lessons.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["en", "nl", "fr", "de", "es"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <!-- ✅ GDPR-FIX: AdSense wordt NIET meer hier onvoorwaardelijk geladen.
         Dit script mag wettelijk pas laden ná actieve cookie-toestemming.
         Zie src/components/CookieBanner.tsx, dat het script injecteert
         zodra de gebruiker op "accepteren" klikt (en het bij een herbezoek
         met eerdere toestemming opnieuw injecteert via CookieBanner). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
